version: '3.9'

services:
  sim:
    build: ./sim
    image: salespulse-sim:latest
    ports:
      - '7000:7000'
      - '7001:7001'
      - '7002:7002'
      - '7003:7003'
      - '7004:7004'
      - '7005:7005'
    environment:
      - SIM_SEED=42
      - SIM_SPEED=60
      - LOG_LEVEL=info
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:7000/health")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  hub:
    build: ./starter
    image: salespulse-hub:latest
    ports:
      - '3000:3000'
    env_file:
      - ./starter/.env
    environment:
      - SIM_HOST=sim
      - LOG_LEVEL=info
    depends_on:
      sim:
        condition: service_healthy
    volumes:
      - ./starter/submission.jsonl:/app/submission.jsonl
    restart: unless-stopped

networks:
  default:
    name: salespulse
