[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "salespulse-hub"
version         = "1.0.0"
description     = "SalesPulse Hub — seven agents, live dashboard, submission writer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=1.8.2",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "respx>=0.21.1",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
    "black>=24.4.2",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where   = ["."]
include = ["hub*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
